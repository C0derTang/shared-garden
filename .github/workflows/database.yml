name: Database

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Daisy migration matches the authored bank
        run: node scripts/sync-daisy-bank.mjs --check
      - name: Start isolated local Supabase
        # Startup output contains local development keys. Keep it out of logs
        # and artifacts; the exit code still fails CI if startup fails.
        run: |
          umask 077
          npm run db:start > "$RUNNER_TEMP/supabase-start.log" 2>&1
      - name: Apply migrations to local database
        run: npm run db:reset
      - name: Test database boundaries
        run: npm run db:test
      - name: Verify platform Auth role lifecycle
        run: |
          docker exec -i supabase_db_shared-garden-clock \
            psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < docs/auth/verify-identity-auth-role.sql
      - name: Verify overlapping planting, entry, and settlement transactions
        run: |
          python3 supabase/tests/concurrency/planting_race.py supabase_db_shared-garden-clock
          python3 supabase/tests/concurrency/entries_race.py supabase_db_shared-garden-clock
          python3 supabase/tests/concurrency/rollover_race.py supabase_db_shared-garden-clock
          python3 supabase/tests/concurrency/peony_race.py supabase_db_shared-garden-clock
          npm run db:reset
          npm run db:test
      - name: Verify real authorized Realtime delivery
        run: |
          umask 077
          node_modules/.bin/supabase status -o json > "$RUNNER_TEMP/garden-status.json"
          node scripts/verify-garden-realtime.mjs "$RUNNER_TEMP/garden-status.json" ci
          node scripts/verify-peony-realtime.mjs "$RUNNER_TEMP/garden-status.json" ci
          npm run db:reset
          npm run db:test
      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
