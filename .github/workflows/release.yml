name: Production release

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned release tools privately
        run: |
          umask 077
          if ! npm ci > "$RUNNER_TEMP/release-install.log" 2>&1; then
            echo 'Dependency installation failed; inspect privately.'
            exit 1
          fi
          if ! npm install --global vercel@59.20.0 >> "$RUNNER_TEMP/release-install.log" 2>&1; then
            echo 'Release tool installation failed; inspect privately.'
            exit 1
          fi
          rm -f "$RUNNER_TEMP/release-install.log"
      - name: Check, build, migrate and deploy the pushed commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node scripts/release/production.mjs
      - name: Remove private release files
        if: always()
        run: |
          rm -rf .vercel .next supabase/.temp
          rm -f "$RUNNER_TEMP/release-install.log"
